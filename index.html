<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>Motos MAER - Casa Pellas</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&amp;family=Barlow+Condensed:wght@600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#E8EEF7;--fg:#01336E;--mu:#3D5276;--c:#fff;--b:#8EA2BF;--p:#01336E;--r:#D40A07;--ok:#0B5B38;--er:#D40A07}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg);font:16px 'Barlow',system-ui,sans-serif;max-width:520px;margin:0 auto;min-height:100vh}
input,select,button,textarea{font-family:inherit}input:focus,select:focus,button:focus-visible,textarea:focus{outline:3px solid #1D4ED8;outline-offset:1px}
.top{background:#01336E;color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;gap:12px}
.top img{width:86px;height:56px;flex:none;object-fit:cover;object-position:50% 0}
.top div{font:700 26px/1.1 'Barlow Condensed',sans-serif;letter-spacing:.03em;text-transform:uppercase}.top small{display:block;font:500 13px 'Barlow',sans-serif;text-transform:none;letter-spacing:0;color:#C4D0E3}
.bar{position:sticky;top:0;z-index:20;background:#01336E;border-bottom:4px solid #D40A07;padding:2px 12px 12px}
nav{display:flex;gap:8px}nav button{flex:1;height:44px;background:transparent;color:#fff;border:1.5px solid #8EA2BF;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;padding:0 4px}
nav button.on{background:#fff;color:#01336E;border-color:#fff}
main{padding:14px 20px 28px}
small,.mu{color:var(--mu)}
button{background:var(--p);color:#fff;border:0;border-radius:8px;min-height:44px;padding:0 16px;font-size:16px;font-weight:600;cursor:pointer}button.s{background:#fff;color:var(--p);border:1.5px solid var(--b)}button:disabled{opacity:.5}#go{background:var(--r)}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1.5px solid var(--b);border-radius:8px;background:#fff;color:var(--fg);font-size:16px}
label{display:block;margin:12px 0 5px;font-size:14px;font-weight:600}
.card{background:#fff;border:1px solid #C4D0E3;border-radius:10px;padding:12px;margin:10px 0}
.er{color:var(--er)}.ok{color:var(--ok)}#msg{min-height:22px;margin:8px 0;font-weight:600}
.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.g>div:first-child{grid-column:1/-1}
.r{display:flex;gap:8px;align-items:center;margin:6px 0}
ol{padding-left:22px;margin:6px 0}li{margin:4px 0}li button{min-height:28px;padding:0 8px;margin-left:6px}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid #C4D0E3;text-align:left;white-space:nowrap}th{color:var(--mu)}
[hidden]{display:none!important}
</style></head><body>

const hoy=()=>new Date().toLocaleDateString('en-CA',{timeZone:TZ});
const COLORES=['AMARILLO','AZUL','BLANCO','CAFE','CELESTE','GRIS','NEGRO','PLATEADO','ROJO','ROSADO','VERDE'];
const MODELOS={'Yamaha':['AG200F','DT125','DT175','FZ150-A V4','FZ150D','FZ150D V2','FZ250','FZ250-A','GPD155-A (NMAX)','MT03','MT-07','MT-09D','MTN155','PW50','R15','R3','R7','RAYZ','SZ150D','TW200','WR450F','XC115B (RAY Z)','XT250','XTZ125','XTZ150','XTZ690','YBR125ED','YBR125G','YD110D-4 CRUX','YFM350','YFM450','YFM700','YFZ50','YXC700E','YZ125','YZ450F','YZF50'],'Genesis':['CR3','CR4V','DM125','GE150-6','HJ110-2 (LUCKY)','HJ150S','KA150','KA150 V2','KLIK 150','MOON 150','RK125','RKS150','RKS180','RKV200','RKV200 CBS','SUNNY','SX1 150','SX2 200','SX2 200 CROSS','SX3 250 4V'],'Hero':['DASH 125','ECO 150','ECO DELUXE','HUNK 125R','HUNK 150','HUNK 150 XTEC','HUNK 160 4V','HUNK 160R','HUNK 250R','IGNITOR','XOOM 110','XPULSE 200'],'Yadea':['DE3','DING DING','E8S PRO','G5','GB60','KS-6PRO','LUNA','M6','TEENA','VE3','X3']};
const ESTADOS=['En espera','Defectuosa','Rehabilitada'];
const badge=e=>`<b style="color:${e==='Rehabilitada'?'var(--ok)':e==='Defectuosa'?'var(--er)':'var(--mu)'}">${esc(e||'En espera')}</b>`;
const MARCAS=['Yamaha','Genesis','Hero','Yadea'];
let CODE='',admin=false,L={modelos:MODELOS,colores:COLORES},R=[],det=[],ex=null;
const st={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
function msg(t,k){$('#msg').textContent=t;$('#msg').className=k||''}
const lines=t=>t.split('\n').map(x=>x.trim()).filter(Boolean);

async function rpc(fn,args){
 const h={'apikey':CFG.key,'Content-Type':'application/json'};if(CFG.key.startsWith('eyJ'))h.Authorization='Bearer '+CFG.key;
 let r;try{r=await fetch(CFG.url.replace(/\/rest\/v1\/?$/,'').replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args)})}catch(e){throw new Error('Sin conexión a internet')}
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
 if(!r.ok){const m=(j&&j.message)||'';throw new Error(m.includes('codigo_invalido')?'Código incorrecto':m.includes('solo_admin')?'Solo el administrador puede hacer esto':(m||'Error '+r.status))}
 return j}

async function entrar(code,silent){
 try{const v=await rpc('maer_verificar',{p_code:code});
  if(!v||!v.ok){if(!silent)$('#le').textContent='Código incorrecto';return false}
  CODE=code;admin=!!v.admin;st.set('maer_code',code);$('#lgn').hidden=true;$('#app').hidden=false;
  if(!admin){$('#sl').disabled=true;$('#sl').textContent='Solo el administrador puede guardar'}
  await cargarListas();await cargarLista();setInterval(()=>cargarLista().catch(()=>{}),20000);return true}
 catch(e){if(!silent)$('#le').textContent=e.message;return false}}
async function cargarListas(){
 try{const c=await rpc('maer_listas',{p_code:CODE}),m={};
  MARCAS.forEach(x=>m[x]=(c&&c.modelos&&c.modelos[x]&&c.modelos[x].length)?c.modelos[x]:MODELOS[x]);
  L={modelos:m,colores:(c&&c.colores&&c.colores.length)?c.colores:COLORES}}catch(e){}
 fillM();fillAdm()}
async function cargarLista(){R=(await rpc('maer_listar',{p_code:CODE}))||[];lista()}

function opts(a,ph){return`<option value="">${ph}</option>`+a.map(x=>`<option>${esc(x)}</option>`).join('')+'<option value="__o">Otros</option>'}
function fillM(){
 const m=$('#ma').value;$('#ma').innerHTML='<option value="">— Marca —</option>'+MARCAS.map(x=>`<option${x===m?' selected':''}>${x}</option>`).join('');
 modelos();$('#co').innerHTML=opts(L.colores||[],'— Color —')}
function modelos(){$('#mo').innerHTML=opts((L.modelos||{})[$('#ma').value]||[],'— Modelo —');$('#mo2').hidden=true}
$('#ma').onchange=modelos;
$('#mo').onchange=()=>$('#mo2').hidden=$('#mo').value!=='__o';
$('#co').onchange=()=>$('#co2').hidden=$('#co').value!=='__o';
const val=(s,i)=>$(s).value==='__o'?$(i).value.trim():$(s).value;
function setSel(s,i,v){const o=[...$(s).options].some(x=>x.value===v&&v);$(s).value=o?v:(v?'__o':'');$(i).hidden=o||!v;$(i).value=o?'':v}

function dets(){$('#dl').innerHTML=det.map((d,i)=>`<li>${esc(d)}<button class="s" data-x="${i}">✕</button></li>`).join('')}
$('#dl').onclick=e=>{const i=e.target.dataset.x;if(i!=null){det.splice(+i,1);dets()}};
function addDet(){const t=$('#dt').value.trim();if(t){det.push(t);$('#dt').value='';dets()}$('#dt').focus()}
$('#ad').onclick=addDet;$('#dt').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addDet()}};

function limpiar(){ex=null;det=[];dets();$('#ch').value='';$('#ma').value='';modelos();$('#co').value='';$('#co2').hidden=true;$('#dt').value=''}
$('#cl').onclick=()=>{limpiar();msg('')};
function cargar(r){ex=r;$('#ch').value=r.chasis;$('#ma').value=r.marca||'';modelos();setSel('#mo','#mo2',r.modelo);setSel('#co','#co2',r.color);det=[...(r.det||[])];dets();show('reg')}
$('#ch').onchange=()=>{const r=R.find(x=>x.k===N($('#ch').value));if(r&&!ex){cargar(r);msg('Este chasis ya estaba registrado; se cargó para editar.','ok')}};

async function guardar(){
 addDet();const c=$('#ch').value.trim(),m=$('#ma').value,mo=val('#mo','#mo2'),co=val('#co','#co2');
 if(!c||!m||!mo||!co)return msg('Complete chasis, marca, modelo y color','er');
 const k=N(c),now=new Date().toISOString();
 const rec={k,chasis:c,marca:m,modelo:mo,color:co,det:[...det],fecha:(ex&&ex.fecha)||hoy(),estado:(ex&&ex.estado)||'En espera',hist:(ex&&ex.hist)||[],rehabFecha:(ex&&ex.rehabFecha)||'',rehabPor:(ex&&ex.rehabPor)||'',creado:(ex&&ex.creado)||now,actualizado:now};
 $('#go').disabled=true;
 try{await rpc('maer_guardar',{p_code:CODE,p_k:k,p_data:rec});await cargarLista();
  msg(`Moto guardada. Chasis: ${c} · ${rec.det.length} detalle(s).`,'ok');limpiar()}
 catch(e){msg('No se guardó: '+e.message,'er')}
 $('#go').disabled=false}
$('#go').onclick=guardar;

function consultar(){
 const k=N($('#q').value),r=R.find(x=>x.k===k),b=$('#qr');b.hidden=false;
 if(!r){b.innerHTML='<span class="er">Chasis no registrado en MAER.</span>';return}
 const sv=st.get('maer_resp');
 const hs=(r.hist||[]).map(h=>`<li>${badge(h.e)} · ${esc(h.f)} · ${esc(h.p)}</li>`).join('');
 b.innerHTML=`<b>${esc(r.chasis)}</b> · ${badge(r.estado)}<br>${esc(r.marca)} · ${esc(r.modelo)} · ${esc(r.color)}<br><small>Registrada: ${r.fecha}</small>`+(r.rehabFecha?`<br><small class="ok">Rehabilitada el ${esc(r.rehabFecha)} por ${esc(r.rehabPor)}</small>`:'')+`<p><b>Detalles (${(r.det||[]).length})</b></p>`+((r.det||[]).length?`<ol>${r.det.map(d=>`<li>${esc(d)}</li>`).join('')}</ol>`:'<p class="mu">Sin detalles.</p>')+
 `<hr><b>Cambiar estado</b><div class="g"><div><label for="ne">Nuevo estado</label><select id="ne">${ESTADOS.map(e=>`<option${e===(r.estado||'En espera')?' selected':''}>${e}</option>`).join('')}</select></div><div><label for="nf">Fecha</label><input type="date" id="nf" value="${hoy()}"></div><div><label for="np">Responsable</label><input id="np" placeholder="Quién lo hizo" value="${esc(sv)}"></div></div><p><button id="na">Aplicar estado</button> <button id="qe" class="s">Editar datos</button></p>`+(hs?`<b>Historial</b><ol>${hs}</ol>`:'');
 $('#qe').onclick=()=>cargar(r);
 $('#na').onclick=async()=>{const e=$('#ne').value,f=$('#nf').value,p=$('#np').value.trim();
  if(!f||!p)return msg('Indique la fecha y quién realizó el cambio','er');
  $('#na').disabled=true;
  try{await cargarLista();const a=R.find(x=>x.k===r.k)||r;
   const u={...a,estado:e,hist:[...(a.hist||[]),{e,f,p}],actualizado:new Date().toISOString(),rehabFecha:e==='Rehabilitada'?f:'',rehabPor:e==='Rehabilitada'?p:''};
   await rpc('maer_guardar',{p_code:CODE,p_k:a.k,p_data:u});st.set('maer_resp',p);await cargarLista();msg(`Estado actualizado a ${e}.`,'ok');consultar()}
  catch(x){msg('No se guardó: '+x.message,'er');$('#na').disabled=false}}}
$('#qb').onclick=consultar;$('#q').onkeydown=e=>{if(e.key==='Enter')consultar()};

function lista(){
 const q=N($('#f').value),L2=R.filter(x=>(!q||[x.chasis,x.marca,x.modelo,x.color].some(v=>N(v).includes(q)))&&(!$('#fe').value||(x.estado||'En espera')===$('#fe').value)).sort((a,b)=>(b.actualizado||'').localeCompare(a.actualizado||''));
 $('#cnt').textContent=`${L2.length} moto(s) en MAER`;
 $('#tb').innerHTML=L2.map(x=>`<tr><td>${esc(x.chasis)}</td><td>${esc(x.marca)}</td><td>${esc(x.modelo)}</td><td>${esc(x.color)}</td><td>${badge(x.estado)}</td><td>${(x.det||[]).length}</td><td>${x.fecha}</td><td>${x.rehabFecha?esc(x.rehabFecha+' · '+x.rehabPor):''}</td><td><button class="s" data-v="${esc(x.k)}">Ver</button></td></tr>`).join('')||'<tr><td colspan="9">Sin registros</td></tr>'}
$('#f').oninput=lista;$('#fe').onchange=lista;
$('#tb').onclick=e=>{const k=e.target.dataset.v;if(k){$('#q').value=k;show('con');consultar()}};

function exportar(){
 const a=[['Chasis','Marca','Modelo','Color','Detalles','Cantidad','Estado','Fecha rehabilitación','Rehabilitada por','Fecha de registro','Última actualización'],...R.map(x=>[x.chasis,x.marca,x.modelo,x.color,(x.det||[]).map((d,i)=>`${i+1}. ${d}`).join('\n'),(x.det||[]).length,x.estado||'En espera',x.rehabFecha||'',x.rehabPor||'',x.fecha,(x.actualizado||'').slice(0,10)])];
 const d=[['Chasis','N°','Detalle'],...R.flatMap(x=>(x.det||[]).map((t,i)=>[x.chasis,i+1,t]))];
 const h=[['Chasis','Estado','Fecha','Responsable'],...R.flatMap(x=>(x.hist||[]).map(t=>[x.chasis,t.e,t.f,t.p]))];
 const wb=XLSX.utils.book_new();[[a,'MAER'],[d,'Detalles'],[h,'Historial']].forEach(([v,n])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(v),n));
 try{XLSX.writeFile(wb,`MAER_${hoy()}.xlsx`)}catch(e){msg('No se pudo generar el Excel','er')}}
$('#ex').onclick=exportar;$('#im').onclick=()=>$('#fi').click();
$('#fi').onchange=async e=>{
 const f=e.target.files[0];if(!f)return;e.target.value='';
 const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets.MAER||wb.Sheets[wb.SheetNames[0]],{defval:'',raw:false});
 const col=(r,n)=>{const k=Object.keys(r).find(k=>k.trim().toUpperCase()===n);return k?String(r[k]).trim():''};
 let n=0;msg('Importando…');
 try{await cargarLista();
  for(const r of rows){const c=col(r,'CHASIS');if(!c)continue;
   const dd=col(r,'DETALLES').split(/\n|;/).map(t=>t.replace(/^\s*\d+[.)-]\s*/,'').trim()).filter(Boolean),now=new Date().toISOString(),k=N(c),old=R.find(z=>z.k===k)||{};
   const rec={k,chasis:c,marca:col(r,'MARCA'),modelo:col(r,'MODELO'),color:col(r,'COLOR'),det:dd,estado:ESTADOS.find(z=>z.toUpperCase()===col(r,'ESTADO').toUpperCase())||'En espera',rehabFecha:col(r,'FECHA REHABILITACIÓN')||col(r,'FECHA REHABILITACION'),rehabPor:col(r,'REHABILITADA POR'),hist:old.hist||[],fecha:old.fecha||hoy(),creado:old.creado||now,actualizado:now};
   await rpc('maer_guardar',{p_code:CODE,p_k:k,p_data:rec});n++}
  await cargarLista();msg(`Importación completada: ${n} moto(s).`,'ok')}catch(e){msg('Falló la importación: '+e.message,'er')}};

function fillAdm(){
 $('#am').innerHTML=MARCAS.map(m=>`<label>${m}</label><textarea rows="4" data-m="${m}">${esc(((L.modelos||{})[m]||[]).join('\n'))}</textarea>`).join('');
 $('#ac').value=(L.colores||[]).join('\n')}
$('#sl').onclick=async()=>{
 const mo={};document.querySelectorAll('#am [data-m]').forEach(t=>mo[t.dataset.m]=lines(t.value));
 const n={modelos:mo,colores:lines($('#ac').value)};
 try{await rpc('maer_guardar_listas',{p_code:CODE,p_data:n});await cargarListas();msg('Listas guardadas','ok')}catch(e){msg('No se guardó: '+e.message,'er')}};

async function scan(){
 const v=$('#vid');v.hidden=false;
 try{const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=s;await v.play();const bd=new BarcodeDetector();
  const t=setInterval(async()=>{const r=await bd.detect(v).catch(()=>[]);if(r[0]){clearInterval(t);s.getTracks().forEach(x=>x.stop());v.hidden=true;$('#ch').value=r[0].rawValue;$('#ch').onchange()}},400)}
 catch(e){v.hidden=true;msg('No se pudo usar la cámara; escriba o pegue el chasis','er')}}
$('#sc').onclick=scan;if('BarcodeDetector' in window)$('#sc').hidden=false;

function show(v){document.querySelectorAll('nav button').forEach(x=>x.className=x.dataset.v===v?'on':'');['reg','con','lst','adm'].forEach(i=>$('#v-'+i).hidden=i!==v)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{show(b.dataset.v);msg('')});

$('#le0').onclick=()=>{const c=$('#cd').value.trim();if(!c)return;$('#le').textContent='';entrar(c)};
$('#cd').onkeydown=e=>{if(e.key==='Enter')$('#le0').click()};
$('#out').onclick=()=>{st.del('maer_code');location.reload()};
if(CFG.url.startsWith('PEGAR')){$('#le').textContent='Falta configurar la conexión (URL y clave de Supabase) dentro del archivo.'}
else if(st.get('maer_code'))entrar(st.get('maer_code'),true);

</script></body></html>
